# /etc/nginx/sites-available/vision_hrms  — adjust server_name and certificate paths.
server {
    listen 80;
    server_name hr.your-company.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hr.your-company.example;

    ssl_certificate     /etc/ssl/certs/hr.your-company.example.crt;
    ssl_certificate_key /etc/ssl/private/hr.your-company.example.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 12m;          # matches MAX_IMPORT_BYTES (10 MB) plus form overhead
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Static assets only. Private uploads are NEVER aliased here — they are
    # streamed by Django after an authorisation check.
    location /static/ {
        alias /srv/vision_hrms/staticfiles/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}
